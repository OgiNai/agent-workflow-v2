[project]
name = "agent-workflow-v2"
version = "0.1.0"
description = "AI Code Review & Refactoring Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.3",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "google-genai>=2.8.0",
    "httpx2>=2.0.0",
    "ipykernel>=7.2.0",
    "numpy>=2.4.6",
    "opentelemetry-api>=1.35.0",
    "opentelemetry-exporter-otlp-proto-http>=1.35.0",
    "opentelemetry-sdk>=1.35.0",
    "pandas>=3.0.3",
    "pydantic-settings>=2.14.2",
    "pytest>=8.0.0",
    "pytest-json-report>=1.5.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn>=0.49.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
